<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>For Milaa ❤️</title>

  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffdde1;
      background-image: linear-gradient(0deg, #ffdde1 0%, #ee9ca7 100%);
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Floating Love + Balloon Background */
    .floaty {
      position: absolute;
      bottom: -120px;
      z-index: 1;
      pointer-events: none;
      will-change: transform, opacity;
      opacity: 0.85;
      animation: floatUp 7s linear infinite;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.08));
    }

    @keyframes floatUp {
      0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0.95; }
      100% { transform: translateY(-130vh) translateX(30px) rotate(8deg); opacity: 0; }
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.85);
      padding: 3rem;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      z-index: 10;
      max-width: 90%;
      width: 500px;
      position: relative;
      backdrop-filter: blur(5px);
      border: 2px solid #fff;
    }

    h1 {
      font-family: 'Pacifico', cursive;
      color: #d63384;
      font-size: 2.5rem;
      margin-bottom: 2rem;
    }

    .buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      align-items: center;
      height: 60px;
      position: relative;
    }

    button {
      padding: 15px 30px;
      font-size: 1.2rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-yes {
      background-color: #ff4757;
      color: white;
      box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
      transition: transform 0.2s;
      z-index: 11;
    }
    .btn-yes:hover {
      transform: scale(1.1);
      background-color: #ff6b81;
    }

    .btn-no {
      background-color: #2f3542;
      color: white;
      box-shadow: 0 5px 15px rgba(47, 53, 66, 0.4);
      position: relative;
      transition: none; /* JS handles smoothness */
      z-index: 99999;
      user-select: none;
      touch-action: none;
    }

    .success-message {
      display: none;
      text-align: center;
    }
    .success-message img {
      max-width: 200px;
      border-radius: 10px;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <div class="container" id="card">
    <div id="question-box">
      <h1>Hi Milaa!! <br /> Will you be my valentine?</h1>
      <div class="buttons">
        <button class="btn-yes" onclick="sheSaidYes()">❤️ YES</button>

        <button
          class="btn-no"
          id="noBtn"
          tabindex="-1"
          aria-label="No (not allowed 😈)"
          onpointerenter="flee(event)"
          onpointermove="flee(event)"
          onmousedown="blockAndFlee(event)"
          ontouchstart="blockAndFlee(event)"
        >
          💔 NO
        </button>
      </div>
    </div>

    <div class="success-message" id="success-msg">
      <h1>Yay! I love you! ❤️</h1>
      <p>See you on date night!</p>
      <img src="https://media.giphy.com/media/26BRv0ThflsHCqDrG/giphy.gif" alt="Love Bear" />
    </div>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const card = document.getElementById('card');

    let moved = false;

    // Smooth movement state
    let currentLeft = 0, currentTop = 0;
    let targetLeft = 0, targetTop = 0;
    let animating = false;

    // Block any click no matter what
    noBtn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
    }, true);

    // If it somehow gets focus, blur + flee
    noBtn.addEventListener('focus', () => {
      noBtn.blur();
      flee({ clientX: window.innerWidth / 2, clientY: window.innerHeight / 2 });
    });

    function blockAndFlee(e) {
      e.preventDefault();
      e.stopPropagation();
      flee(e);
    }

    // --- STAY-NEAR-CARD BOUNDS (allowed ring around card) ---
    function getCardRingBounds() {
      const padding = 16;  // screen edge padding
      const btnWidth = noBtn.offsetWidth;
      const btnHeight = noBtn.offsetHeight;

      const rect = card.getBoundingClientRect();

      // Responsive margin around card (how far NO can roam)
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const baseMargin = 260;
      const margin = Math.max(150, Math.min(baseMargin, Math.floor(Math.min(vw, vh) * 0.38)));

      // Outer rectangle (where the button may exist)
      let minLeft = rect.left - margin;
      let maxLeft = rect.right + margin - btnWidth;
      let minTop  = rect.top - margin;
      let maxTop  = rect.bottom + margin - btnHeight;

      // Clamp outer to viewport
      minLeft = Math.max(padding, minLeft);
      minTop  = Math.max(padding, minTop);
      maxLeft = Math.min(vw - btnWidth - padding, maxLeft);
      maxTop  = Math.min(vh - btnHeight - padding, maxTop);

      if (maxLeft < minLeft) maxLeft = minLeft;
      if (maxTop < minTop) maxTop = minTop;

      // Inner "no-go" rectangle = card itself (expanded slightly so it never touches)
      const gap = 18; // space between button and card
      const inner = {
        left: rect.left - gap,
        right: rect.right + gap,
        top: rect.top - gap,
        bottom: rect.bottom + gap
      };

      return { outer: { minLeft, maxLeft, minTop, maxTop }, inner, btnWidth, btnHeight };
    }

    function rectsOverlap(a, b) {
      return !(a.right <= b.left || a.left >= b.right || a.bottom <= b.top || a.top >= b.bottom);
    }

    function clamp(v, min, max) {
      return Math.min(Math.max(v, min), max);
    }

    // Project a candidate point into the OUTER bounds AND ensure it does NOT overlap the INNER (card) box.
    // If it overlaps, snap it to the nearest side of the inner box (still within outer).
    function enforceRingRules(L, T) {
      const { outer, inner, btnWidth, btnHeight } = getCardRingBounds();

      // clamp to outer first
      let left = clamp(L, outer.minLeft, outer.maxLeft);
      let top  = clamp(T, outer.minTop,  outer.maxTop);

      const btnRect = {
        left,
        top,
        right: left + btnWidth,
        bottom: top + btnHeight
      };

      // If it overlaps the card zone, push it to the nearest edge (left/right/top/bottom)
      if (rectsOverlap(btnRect, inner)) {
        // distances to move out on each side
        const pushLeft  = Math.abs((inner.left - btnWidth) - left);     // place button just left of inner
        const pushRight = Math.abs(inner.right - left);                 // place button just right of inner
        const pushTop   = Math.abs((inner.top - btnHeight) - top);      // place button just above inner
        const pushBottom= Math.abs(inner.bottom - top);                 // place button just below inner

        const minPush = Math.min(pushLeft, pushRight, pushTop, pushBottom);

        if (minPush === pushLeft) {
          left = inner.left - btnWidth;
        } else if (minPush === pushRight) {
          left = inner.right;
        } else if (minPush === pushTop) {
          top = inner.top - btnHeight;
        } else {
          top = inner.bottom;
        }

        // Clamp again to outer bounds (safety)
        left = clamp(left, outer.minLeft, outer.maxLeft);
        top  = clamp(top,  outer.minTop,  outer.maxTop);
      }

      return { left, top };
    }

    function flee(e) {
      if (!moved) {
        const rect = noBtn.getBoundingClientRect();

        // Lock to fixed at exact current position (no jump)
        noBtn.style.position = 'fixed';
        noBtn.style.left = rect.left + 'px';
        noBtn.style.top = rect.top + 'px';

        currentLeft = rect.left;
        currentTop = rect.top;
        targetLeft = currentLeft;
        targetTop = currentTop;

        moved = true;
      }

      const mx = (typeof e.clientX === 'number') ? e.clientX : window.innerWidth / 2;
      const my = (typeof e.clientY === 'number') ? e.clientY : window.innerHeight / 2;

      setTargetRingAwayFromMouse(mx, my);
      startAnimation();
    }

    // Anti-stuck + ring-only logic:
    // - propose away-vector
    // - try rotated vectors
    // - fallback random point in ring (outer minus inner)
    function setTargetRingAwayFromMouse(mouseX, mouseY) {
      const { btnWidth, btnHeight } = getCardRingBounds();

      const btnCenterX = currentLeft + btnWidth / 2;
      const btnCenterY = currentTop + btnHeight / 2;

      let dx = btnCenterX - mouseX;
      let dy = btnCenterY - mouseY;

      const mag = Math.hypot(dx, dy) || 1;
      dx /= mag;
      dy /= mag;

      const step = 210;
      const minMove = 22;

      function propose(nx, ny) {
        const rawL = currentLeft + nx * step;
        const rawT = currentTop  + ny * step;

        const enforced = enforceRingRules(rawL, rawT);

        const distMove = Math.hypot(enforced.left - currentLeft, enforced.top - currentTop);
        const movedEnough = distMove >= minMove;

        return { L: enforced.left, T: enforced.top, movedEnough };
      }

      // 1) Straight away
      let best = propose(dx, dy);

      // 2) Try rotated vectors if not enough movement
      if (!best.movedEnough) {
        const angles = [30, -30, 60, -60, 90, -90, 120, -120, 150, -150];
        for (const a of angles) {
          const rad = (a * Math.PI) / 180;
          const rx = dx * Math.cos(rad) - dy * Math.sin(rad);
          const ry = dx * Math.sin(rad) + dy * Math.cos(rad);

          const cand = propose(rx, ry);
          if (cand.movedEnough) { best = cand; break; }
        }
      }

      // 3) Random point in ring (outer but not inside inner), far from mouse
      if (!best.movedEnough) {
        const { outer, inner } = getCardRingBounds();

        let chosen = null;
        const tries = 40;

        for (let i = 0; i < tries; i++) {
          const rL = outer.minLeft + Math.random() * (outer.maxLeft - outer.minLeft);
          const rT = outer.minTop  + Math.random() * (outer.maxTop  - outer.minTop);

          const candidateRect = { left: rL, top: rT, right: rL + btnWidth, bottom: rT + btnHeight };
          if (rectsOverlap(candidateRect, inner)) continue;

          const rCX = rL + btnWidth / 2;
          const rCY = rT + btnHeight / 2;

          const farFromMouse = Math.hypot(rCX - mouseX, rCY - mouseY) > 160;
          const farFromCurrent = Math.hypot(rL - currentLeft, rT - currentTop) > 70;

          if (farFromMouse && farFromCurrent) {
            chosen = { L: rL, T: rT };
            break;
          }
        }

        if (chosen) best = { ...chosen, movedEnough: true };
      }

      targetLeft = best.L;
      targetTop  = best.T;
    }

    function startAnimation() {
      if (animating) return;
      animating = true;

      function animate() {
        const ease = 0.20;

        currentLeft += (targetLeft - currentLeft) * ease;
        currentTop  += (targetTop  - currentTop)  * ease;

        // Enforce ring rules every frame so it never overlaps card
        const enforced = enforceRingRules(currentLeft, currentTop);
        currentLeft = enforced.left;
        currentTop  = enforced.top;

        noBtn.style.left = currentLeft + 'px';
        noBtn.style.top  = currentTop + 'px';

        if (Math.abs(targetLeft - currentLeft) > 0.5 || Math.abs(targetTop - currentTop) > 0.5) {
          requestAnimationFrame(animate);
        } else {
          animating = false;
        }
      }

      requestAnimationFrame(animate);
    }

    // Keep it valid after resize
    window.addEventListener('resize', () => {
      if (!moved) return;
      const enforcedC = enforceRingRules(currentLeft, currentTop);
      currentLeft = enforcedC.left;
      currentTop  = enforcedC.top;

      const enforcedT = enforceRingRules(targetLeft, targetTop);
      targetLeft = enforcedT.left;
      targetTop  = enforcedT.top;

      noBtn.style.left = currentLeft + 'px';
      noBtn.style.top  = currentTop  + 'px';
    });

    // --- Success Logic ---
    function sheSaidYes() {
      document.getElementById('question-box').style.display = 'none';
      document.getElementById('success-msg').style.display = 'block';
      spawnFloaties(80);
    }

    // --- Love Signs + Balloons ---
    const LOVE_SIGNS = ['❤️','💖','💕','💗','💘','💞','😍','🥰','😘','✨','💝','🫶','🌹'];
    const BALLOONS = ['🎈','🎈','🎈','🎊','🎉','🎀'];

    function spawnFloaties(count) {
      const body = document.body;

      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.classList.add('floaty');

        const pool = (Math.random() < 0.68) ? LOVE_SIGNS : BALLOONS;
        el.textContent = pool[Math.floor(Math.random() * pool.length)];

        el.style.left = (Math.random() * 100) + 'vw';
        el.style.animationDuration = (Math.random() * 3.5 + 3.5) + 's';
        el.style.fontSize = (Math.random() * 26 + 18) + 'px';
        el.style.animationDelay = (Math.random() * 0.8) + 's';

        body.appendChild(el);
        setTimeout(() => el.remove(), 8500);
      }
    }

    setInterval(() => spawnFloaties(4), 550);
    spawnFloaties(18);
  </script>
</body>
</html>
