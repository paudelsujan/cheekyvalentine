<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Milaa ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* Force body to fit screen exactly, no scrollbars */
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            background-color: #ffdde1; 
            background-image: linear-gradient(0deg, #ffdde1 0%, #ee9ca7 100%);
            font-family: 'Poppins', sans-serif;
            overflow: hidden; /* CRITICAL: Prevents scrollbars */
            position: relative;
        }

        /* Floating Hearts Background */
        .bg-heart {
            position: absolute;
            bottom: -100px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 2rem;
            animation: float 6s linear infinite;
            z-index: 1; /* Lowest layer */
            pointer-events: none; /* Mouse ignores these */
        }

        @keyframes float {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-120vh); opacity: 0; }
        }

        /* Main Card */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.85);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            z-index: 10;
            max-width: 90%;
            width: 500px;
            position: relative;
            backdrop-filter: blur(5px);
            border: 2px solid #fff;
        }

        h1 {
            font-family: 'Pacifico', cursive;
            color: #d63384;
            font-size: 2.5rem;
            margin-bottom: 2rem;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            height: 60px; /* Reserves space so layout doesn't collapse */
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            white-space: nowrap;
        }

        /* YES Button */
        .btn-yes {
            background-color: #ff4757;
            color: white;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            transition: transform 0.2s;
            z-index: 11;
        }
        
        .btn-yes:hover {
            transform: scale(1.1);
            background-color: #ff6b81;
        }

        /* NO Button - The Moving Target */
        .btn-no {
            background-color: #2f3542;
            color: white;
            box-shadow: 0 5px 15px rgba(47, 53, 66, 0.4);
            
            /* Initial State: In the flow */
            position: relative;
            
            /* Animation Physics */
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 99999; /* Highest priority: Never disappears behind anything */
        }

        /* Success Message */
        .success-message {
            display: none;
            text-align: center;
        }
        
        .success-message img {
            max-width: 200px;
            border-radius: 10px;
            margin-top: 20px;
        }

    </style>
</head>
<body>

    <div id="bg-hearts"></div>

    <div class="container">
        <div id="question-box">
            <h1>Hi Milaa!! <br> Will you be my valentine?</h1>
            <div class="buttons">
                <button class="btn-yes" onclick="sheSaidYes()">
                    ❤️ YES
                </button>
                <button class="btn-no" id="noBtn" onmouseover="flee()">
                    💔 NO
                </button>
            </div>
        </div>

        <div class="success-message" id="success-msg">
            <h1>Yay! I love you! ❤️</h1>
            <p>See you on date night!</p>
            <img src="https://media.giphy.com/media/26BRv0ThflsHCqDrG/giphy.gif" alt="Love Bear">
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        let moved = false; // Flag to track if it has moved from original spot

        function flee() {
            if (!moved) {
                // FIRST MOVE: This fixes the "Jump" glitch
                // 1. Get current position
                const rect = noBtn.getBoundingClientRect();
                
                // 2. Switch to fixed positioning at EXACT same coordinates
                noBtn.style.position = 'fixed';
                noBtn.style.left = rect.left + 'px';
                noBtn.style.top = rect.top + 'px';
                
                // 3. Mark as moved so we don't reset this again
                moved = true;
                
                // 4. Slight delay before first jump to allow CSS to catch up
                // preventing the teleport glitch
                setTimeout(moveButtonRandomly, 50);
            } else {
                moveButtonRandomly();
            }
        }

        function moveButtonRandomly() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;

            // PADDING: Keep button 50px away from all edges
            // This prevents it from partially disappearing
            const padding = 50;

            // Calculate safe area
            const maxLeft = width - btnWidth - padding;
            const maxTop = height - btnHeight - padding;

            // Generate random coordinates strictly within safe area
            // Math.max ensures we don't go below padding (top/left edges)
            const randomLeft = Math.max(padding, Math.floor(Math.random() * maxLeft));
            const randomTop = Math.max(padding, Math.floor(Math.random() * maxTop));

            // Apply new coordinates
            noBtn.style.left = randomLeft + 'px';
            noBtn.style.top = randomTop + 'px';
        }

        // Success Logic
        function sheSaidYes() {
            document.getElementById('question-box').style.display = 'none';
            document.getElementById('success-msg').style.display = 'block';
            createHearts(50);
        }

        // Background Heart Generator
        function createHearts(count) {
            const body = document.querySelector('body');
            for (let i = 0; i < count; i++) {
                const heart = document.createElement('div');
                heart.innerHTML = '❤️';
                heart.classList.add('bg-heart');
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
                heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
                body.appendChild(heart);
                setTimeout(() => {
                    heart.remove();
                }, 6000);
            }
        }

        setInterval(() => createHearts(3), 500);

    </script>
</body>
</html>
