<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Milaa ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            background-color: #ffdde1; 
            background-image: linear-gradient(0deg, #ffdde1 0%, #ee9ca7 100%);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Floating Hearts Background */
        .bg-heart {
            position: absolute;
            bottom: -100px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 2rem;
            animation: float 6s linear infinite;
            z-index: 0;
        }

        @keyframes float {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-120vh); opacity: 0; }
        }

        /* Main Card */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.85);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            z-index: 10;
            max-width: 90%;
            position: relative;
            backdrop-filter: blur(5px);
            border: 2px solid #fff;
        }

        h1 {
            font-family: 'Pacifico', cursive;
            color: #d63384;
            font-size: 3rem;
            margin-bottom: 2rem;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            /* Added min-height to prevent layout shift when NO leaves */
            min-height: 60px; 
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
        }

        /* Yes Button */
        .btn-yes {
            background-color: #ff4757;
            color: white;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            transition: transform 0.2s;
        }
        
        .btn-yes:hover {
            transform: scale(1.1);
            background-color: #ff6b81;
        }

        /* No Button - UPDATED for Smoothness */
        .btn-no {
            background-color: #2f3542;
            color: white;
            box-shadow: 0 5px 15px rgba(47, 53, 66, 0.4);
            /* Important: position absolute allows us to move it out of flex flow easily */
            position: absolute; 
            /* Start it "relative" effectively by not setting top/left initially, 
               but we handle centering via JS or CSS structure. 
               For simplicity, we let it sit in flow first, then fix it. */
            position: static; 
            
            /* The transition makes the movement smooth */
            transition: left 0.4s ease, top 0.4s ease;
            z-index: 9999; /* Ensures it is ALWAYS on top */
        }

        /* Success Message */
        .success-message {
            display: none;
            text-align: center;
        }
        
        .success-message img {
            max-width: 200px;
            border-radius: 10px;
            margin-top: 20px;
        }

    </style>
</head>
<body>

    <div id="bg-hearts"></div>

    <div class="container">
        <div id="question-box">
            <h1>Hi Milaa!! <br> Will you be my valentine?</h1>
            <div class="buttons">
                <button class="btn-yes" onclick="sheSaidYes()">
                    ❤️ YES
                </button>
                <button class="btn-no" id="noBtn" onmouseover="flee()">
                    💔 NO
                </button>
            </div>
        </div>

        <div class="success-message" id="success-msg">
            <h1>Yay! I love you! ❤️</h1>
            <p>See you on date night!</p>
            <img src="https://media.giphy.com/media/26BRv0ThflsHCqDrG/giphy.gif" alt="Love Bear">
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');

        function flee() {
            // 1. Get current viewport size
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            
            // 2. Get button size
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;

            // 3. Define the Safe Buffer (so it doesn't touch the edge)
            const padding = 50; 

            // 4. Calculate the Maximum allowable X and Y
            // Window Width - Button Width - Padding = Maximum Left Position
            const maxX = windowWidth - btnWidth - padding;
            const maxY = windowHeight - btnHeight - padding;

            // 5. Generate Random Coordinates within the safe zone
            // Math.max ensures it doesn't go too far top/left (negative)
            const randomX = Math.max(padding, Math.random() * maxX);
            const randomY = Math.max(padding, Math.random() * maxY);

            // 6. Apply the movement
            // We switch to 'fixed' so it is relative to the screen, not the card
            noBtn.style.position = 'fixed'; 
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        function sheSaidYes() {
            document.getElementById('question-box').style.display = 'none';
            document.getElementById('success-msg').style.display = 'block';
            createHearts(50);
        }

        function createHearts(count) {
            const body = document.querySelector('body');
            for (let i = 0; i < count; i++) {
                const heart = document.createElement('div');
                heart.innerHTML = '❤️';
                heart.classList.add('bg-heart');
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
                heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
                body.appendChild(heart);
                setTimeout(() => {
                    heart.remove();
                }, 6000);
            }
        }

        setInterval(() => createHearts(3), 500);

    </script>
</body>
</html>
